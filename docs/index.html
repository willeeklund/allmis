<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allmis i Stora mossen</title>
<meta name="description" content="När är det allmänhetens åkning i IK Göta Bromma-hallen?">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="logga.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#AF2924" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d0c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Allmis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ik-red: #AF2924;
    --ik-red-dark: #7c1d19;
    --ik-gold: #b8963f;
    --bg: #fbf7f6;
    --bg-2: #f3e8e6;
    --text: #221615;
    --muted: #5a4443;
    --card: #ffffff;
    --line: #ead6d3;
    --yes: var(--ik-red);
    --yes-text: #ffffff;
    --now: var(--ik-gold);
    --now-text: #221615;
    --no: #ffffff;
    --link: var(--ik-red-dark);
    --stale: var(--ik-red-dark);
    --shadow: 0 6px 0 #e2cbc8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #170d0c;
      --bg-2: #22110f;
      --text: #fbefed;
      --muted: #c9adaa;
      --card: #2a1816;
      --line: #4a2a27;
      --now: #d4b25a;
      --no: #2a1816;
      --link: #f2938b;
      --stale: #f2938b;
      --shadow: 0 6px 0 #0b0605;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%) fixed;
    background-color: var(--bg);
    line-height: 1.25;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 0 18px;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--ik-red);
  }
  @media (prefers-color-scheme: dark) { h1 { color: var(--text); } }
  h1 img {
    width: 44px;
    height: 44px;
    padding: 5px;
    border-radius: 50%;
    background: #ffffff;
    object-fit: contain;
  }

  .hero {
    border-radius: 28px;
    padding: 24px 20px 26px;
    text-align: center;
    background: var(--no);
    border: 3px solid var(--line);
    box-shadow: var(--shadow);
  }
  .hero.yes { background: var(--yes); color: var(--yes-text); border-color: transparent; }
  .hero.now { background: var(--now); color: var(--now-text); border-color: transparent; }
  .hero .label {
    display: inline-block;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.1);
  }
  .hero.yes .label { background: rgba(255,255,255,.2); }
  .hero .big {
    margin: 12px 0 4px;
    font-size: clamp(2.6rem, 13vw, 4.2rem);
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .hero .big + .big { margin-top: 0; }
  .hero .big.past { opacity: .4; text-decoration: line-through; text-decoration-thickness: 4px; }
  .hero .what { font-size: 1.6rem; font-weight: 600; }
  .hero .sub { margin-top: 14px; font-size: 1.35rem; font-weight: 600; }
  .hero .note { margin-top: 6px; font-size: 1.05rem; font-weight: 500; opacity: .8; }
  .hero .emoji { font-size: 3.4rem; line-height: 1; display: block; margin-bottom: 6px; }

  h2 { margin: 30px 4px 12px; font-size: 1.3rem; font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 18px;
    background: var(--card);
    border: 2px solid var(--line);
  }
  li .day { font-size: 1.35rem; font-weight: 600; }
  li .day small { display: block; font-size: .9rem; font-weight: 500; color: var(--muted); }
  li .times { text-align: right; }
  li .t { display: block; font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  li .n { display: block; font-size: .9rem; font-weight: 500; color: var(--muted); }
  li.has { border-color: var(--yes); border-width: 3px; }
  li.none .times { color: var(--muted); font-size: 1.1rem; font-weight: 500; }

  footer { margin-top: 32px; text-align: center; font-size: .95rem; color: var(--muted); }
  footer p { margin: 6px 0; }
  footer a { color: var(--link); font-weight: 600; }
  .stale { color: var(--stale); font-weight: 600; }
  .qr { margin: 28px auto 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .qr img { width: 180px; height: 180px; padding: 10px; background: #fff; border-radius: 16px; border: 3px solid var(--line); }
  .qr p { margin: 0; font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<main>
  <h1><img src="logga.png" alt="IK Göta">Allmis i Stora mossen</h1>
  <section id="hero" class="hero" aria-live="polite">
    <span class="label">Laddar…</span>
  </section>
  <h2>Kommande dagar</h2>
  <ul id="week"></ul>
  <footer>
    <p id="updated"></p>
    <p>Tiderna kommer från istidsschemat på <a id="source" href="https://www.ikgota.se/ikgota/dokument#folder=73449" rel="noopener">ikgota.se</a>. Kolla där om du vill vara helt säker.</p>
    <figure class="qr">
      <img src="qr.svg" alt="QR-kod med länk till den här sidan">
      <p>Skanna för att öppna den här sidan</p>
      <a href="https://willeeklund.github.io/allmis/">willeeklund.github.io/allmis</a>
    </figure>
  </footer>
</main>
<script>
const TZ = "Europe/Stockholm";
const MAIN_HALL = "HCL Arena";
const DAYS_AHEAD = 7;
let data = null;
let offline = false;

const dateFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const timeFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const weekdayFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "UTC", weekday: "long" });
const shortDateFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "UTC", day: "numeric", month: "short" });

const todayISO = (now) => dateFmt.format(now);
const nowHHMM = (now) => timeFmt.format(now);
const asDate = (iso) => new Date(iso + "T00:00:00Z");
const addDays = (iso, n) => new Date(asDate(iso).getTime() + n * 86400000).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((asDate(b) - asDate(a)) / 86400000);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const dash = (s) => `${s.start}–${s.end}`;

function dayName(iso, today) {
  const diff = daysBetween(today, iso);
  if (diff === 0) return "idag";
  if (diff === 1) return "i morgon";
  const wd = weekdayFmt.format(asDate(iso));
  return diff < 7 ? wd : `${wd} ${shortDateFmt.format(asDate(iso)).replace(".", "")}`;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function extra(s) {
  return [s.hall !== MAIN_HALL ? s.hall : "", s.note].filter(Boolean).join(" · ");
}

function renderHero(now, today) {
  const hero = document.getElementById("hero");
  hero.className = "hero";
  hero.replaceChildren();
  const hhmm = nowHHMM(now);
  const todays = data.sessions.filter((s) => s.date === today);
  const current = todays.find((s) => s.start <= hhmm && hhmm < s.end);
  const upcoming = todays.filter((s) => hhmm < s.end);

  if (current) {
    hero.classList.add("now");
    hero.append(
      el("span", { class: "label" }, "Just nu!"),
      el("div", { class: "what" }, "Allmis pågår ⛸️"),
      el("div", { class: "big" }, dash(current)),
      el("div", { class: "sub" }, `Du hinner åka till ${current.end}`),
    );
    if (extra(current)) hero.append(el("div", { class: "note" }, extra(current)));
    return;
  }

  if (upcoming.length) {
    hero.classList.add("yes");
    hero.append(el("span", { class: "label" }, "Idag"), el("div", { class: "what" }, "Allmis ⛸️"));
    for (const s of todays) {
      hero.append(el("div", { class: "big" + (s.end <= hhmm ? " past" : "") }, dash(s)));
    }
    const notes = [...new Set(upcoming.map(extra).filter(Boolean))];
    if (notes.length) hero.append(el("div", { class: "note" }, notes.join(" · ")));
    return;
  }

  const next = data.sessions.find((s) => s.date > today);
  const unknownToday = today > data.coverage.to || today < data.coverage.from;
  hero.append(
    el("span", { class: "emoji" }, unknownToday ? "🤷" : "😢"),
    el("div", { class: "what" }, unknownToday ? "Schemat för idag är inte ute än"
      : todays.length ? "Allmis är slut för idag" : "Ingen allmis idag"),
  );
  if (next) {
    hero.append(el("div", { class: "sub" }, `Nästa: ${dayName(next.date, today)} kl ${next.start}`));
  } else {
    hero.append(el("div", { class: "sub" }, "Nästa allmis är inte inlagd än"));
  }
}

function renderWeek(today) {
  const list = document.getElementById("week");
  list.replaceChildren();
  for (let i = 1; i <= DAYS_AHEAD; i++) {
    const iso = addDays(today, i);
    const sessions = data.sessions.filter((s) => s.date === iso);
    const known = iso >= data.coverage.from && iso <= data.coverage.to;
    const label = el("div", { class: "day" }, cap(dayName(iso, today)));
    if (i === 1) label.append(el("small", {}, cap(weekdayFmt.format(asDate(iso))) + " " + shortDateFmt.format(asDate(iso)).replace(".", "")));
    const times = el("div", { class: "times" });
    if (sessions.length) {
      for (const s of sessions) {
        times.append(el("span", { class: "t" }, dash(s)));
        if (extra(s)) times.append(el("span", { class: "n" }, extra(s)));
      }
    } else {
      times.append(known ? "Ingen allmis" : "Inte klart än");
    }
    list.append(el("li", { class: sessions.length ? "has" : "none" }, label, times));
  }
}

function renderFooter(now) {
  const p = document.getElementById("updated");
  const updated = new Date(data.updated);
  const day = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" }).format(updated);
  p.replaceChildren(`Uppdaterad: ${day} kl ${timeFmt.format(updated)}`);
  if (offline) p.append(" ", el("span", { class: "stale" }, "(ingen internet – sparat schema)"));
  else if (now - updated > 2 * 86400000) p.append(" ", el("span", { class: "stale" }, "(kan vara gammalt)"));
  if (data.source) document.getElementById("source").href = data.source;
}

function render() {
  if (!data) return;
  const now = new Date();
  const today = todayISO(now);
  renderHero(now, today);
  renderWeek(today);
  renderFooter(now);
}

async function load() {
  try {
    const res = await fetch("allmis.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    offline = res.headers.get("X-Allmis-Offline") === "1";
    render();
  } catch (e) {
    if (data) return;
    const hero = document.getElementById("hero");
    hero.className = "hero";
    hero.replaceChildren(
      el("span", { class: "emoji" }, "🙈"),
      el("div", { class: "what" }, "Kunde inte ladda schemat"),
      el("div", { class: "sub" }, "Kolla på ikgota.se i stället"),
    );
  }
}

const RELOAD_AFTER_MS = 30 * 60 * 1000;
let hiddenAt = null;

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    hiddenAt = Date.now();
    return;
  }
  if (hiddenAt && Date.now() - hiddenAt > RELOAD_AFTER_MS) {
    location.reload();
    return;
  }
  render();
  load();
  navigator.serviceWorker?.getRegistration().then((reg) => reg?.update());
});
window.addEventListener("online", load);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

load();
setInterval(render, 60 * 1000);
setInterval(load, 60 * 60 * 1000);
</script>
</body>
</html>
