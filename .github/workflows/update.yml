name: Uppdatera allmis

on:
  schedule:
    # 08:15 svensk tid: 06:15 UTC på sommaren, 07:15 UTC på vintern
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-allmis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör tester
        run: python -m pytest -q

      - name: Hämta istidsschema och skriv docs/allmis.json
        run: python -m allmis.fetch

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/allmis.json
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatera allmis $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
            git push
          fi
